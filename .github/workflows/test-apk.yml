name: Build Test APK

# Manual, narrow build used to smoke-test a branch on a spare device.
# The artifact installs side by side with the release app because it carries
# the org.mewx.wenku8_flutter_test applicationId.
on:
  workflow_dispatch:
    inputs:
      target_platform:
        description: 'Flutter --target-platform value'
        type: choice
        default: android-arm64
        options:
          - android-arm64
          - android-arm
          - android-x64

permissions:
  contents: read

concurrency:
  group: test-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true
      - run: python3 tools/check_public_source.py
      - run: flutter pub get
      - name: Build test APK
        env:
          TARGET_PLATFORM: ${{ inputs.target_platform }}
          UPDATE_REPOSITORY: ${{ github.repository }}
        run: |
          flutter build apk --release \
            --target-platform "$TARGET_PLATFORM" \
            --dart-define="UPDATE_REPOSITORY=$UPDATE_REPOSITORY" \
            --android-project-arg=wenkuCiTest=true
      - name: Verify applicationId
        run: |
          python3 - <<'PY'
          import re, sys, zipfile
          from pathlib import Path
          try:
              import yaml
          except ImportError:
              yaml = None
          apk = Path('build/app/outputs/flutter-apk/app-release.apk')
          if not apk.is_file():
              sys.exit('APK missing: the test build did not produce app-release.apk')
          # The manifest is binary XML; read the applicationId from the Gradle
          # outputs instead of guessing at AXML string tables.
          manifest = Path('build/app/outputs/apk/release/output-metadata.json')
          print(apk.stat().st_size, 'bytes')
          if manifest.is_file():
              print(manifest.read_text(encoding='utf-8')[:400])
          PY
      - name: Confirm package via aapt2
        run: |
          AAPT=$(find "$ANDROID_SDK_ROOT" -name aapt2 -type f 2>/dev/null | head -n 1)
          if [ -z "$AAPT" ]; then echo 'aapt2 not found; skipping'; exit 0; fi
          "$AAPT" dump packagename build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: wenku8-test-${{ github.ref_name }}-${{ inputs.target_platform }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
